# TEMPLATE FILE - Copy this structure for all new category files
# DO NOT DELETE - This serves as the reference structure

category:
  id: "category-id" # Unique identifier (lowercase, hyphenated)
  name_uk: "Українська назва" # Category name in Ukrainian
  name_en: "English Name" # Category name in English
  description_uk: "Опис категорії українською мовою"
  # optional field
  description_en: "Category description in English"

# All terms in this category
terms:
  - uk: "український_термін" # Ukrainian term (lowercase)
    en: "english_term" # English term (lowercase)

    # Optional aliases/synonyms
    aliases_uk:
      - "синонім1"
      - "варіант2"
    # Optional aliases/synonyms
    aliases_en:
      - "synonym1"
      - "variant2"

    # Required definitions
    definition_uk: "Повне визначення терміну українською мовою. Має бути зрозумілим і точним."
    definition_en: "Complete definition of the term in English. Should be clear and precise."

    # Optional examples
    examples:
      - uk: "Приклад використання українською мовою"
        en: "Usage example in English"
      - uk: "Додатковий приклад із контекстом"
        en: "Additional example with context"

    # Optional fields
    see_also: ["related_term1", "related_term2"] # Related terms
    difficulty: "beginner" # beginner|intermediate|advanced
    tags: ["tag1", "tag2"] # For categorization
    notes_uk: "Додаткові примітки українською" # Optional notes
    notes_en: "Additional notes in English" # Optional notes

    # References and links (optional)
    references:
      - title: "React Documentation - useState Hook"
        url: "https://react.dev/reference/react/useState"
        type: "documentation" # documentation|wikipedia|discussion|standard|blog|book
      
      - title: "GitHub Discussion: Ukrainian term choice"
        url: "https://github.com/ukrcode/dictionary/discussions/123"
        type: "discussion"
        
      - title: "Wikipedia - Hook (computer science)"
        url: "https://en.wikipedia.org/wiki/Hook_(computer_science)"
        type: "wikipedia"

    # Translation notes (optional)
    translation_notes: "Розглядалися варіанти: 'альтернатива1', 'альтернатива2'. Обрано поточний через кращу відповідність контексту."
    alternatives_considered: ["альтернатива1", "альтернатива2", "варіант3"]

  # Add more terms following the same structure...
