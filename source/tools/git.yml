category:
  id: "git"
  name_uk: "Git"
  name_en: "Git"
  description_uk: "Термінологія системи контролю версій Git та пов'язаних понять"
  description_en: "Git version control system terminology and related concepts"

terms:
  - uk: "репозиторій"
    en: "repository"
    aliases_uk:
      - "репо"
      - "сховище"
    aliases_en:
      - "repo"
    definition_uk: "Директорія, що містить всі файли проекту та історію їх змін, керовану Git"
    definition_en: "Directory containing all project files and their change history managed by Git"
    examples:
      - uk: "Клонуйте репозиторій командою git clone"
        en: "Clone the repository with git clone command"
      - uk: "Локальний репозиторій синхронізується з віддаленим"
        en: "Local repository syncs with remote repository"
    see_also: ["клон", "віддалений_репозиторій", "локальний_репозиторій"]
    tags: ["основи", "структура"]
    references:
      - title: "Git Documentation - Repository"
        url: "https://git-scm.com/docs/gitrepository-layout"
        type: "documentation"

  - uk: "коміт"
    en: "commit"
    definition_uk: "Знімок стану файлів у репозиторії в певний момент часу з описом змін"
    definition_en: "Snapshot of files in repository at a specific point in time with description of changes"
    examples:
      - uk: "Зробіть коміт своїх змін командою git commit"
        en: "Commit your changes with git commit command"
      - uk: "Кожен коміт має унікальний хеш-ідентифікатор"
        en: "Each commit has a unique hash identifier"
    see_also: ["хеш", "повідомлення_коміту", "автор"]
    tags: ["основи", "зміни"]
    references:
      - title: "Git Documentation - Commit"
        url: "https://git-scm.com/docs/git-commit"
        type: "documentation"

  - uk: "гілка"
    en: "branch"
    aliases_uk:
      - "бранч"
      - "відгалуження"
    definition_uk: "Незалежна лінія розробки, що дозволяє працювати над різними функціями паралельно"
    definition_en: "Independent line of development allowing parallel work on different features"
    examples:
      - uk: "Створіть нову гілку командою git branch feature-name"
        en: "Create new branch with git branch feature-name command"
      - uk: "Основна гілка зазвичай називається main або master"
        en: "Main branch is usually called main or master"
    see_also: ["злиття", "перемикання", "головна_гілка"]
    tags: ["розробка", "паралельність"]
    references:
      - title: "Git Documentation - Branching"
        url: "https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell"
        type: "documentation"

  - uk: "злиття"
    en: "merge"
    aliases_uk:
      - "мердж"
      - "об'єднання"
    definition_uk: "Процес об'єднання змін з однієї гілки в іншу"
    definition_en: "Process of combining changes from one branch into another"
    examples:
      - uk: "Злийте feature-гілку в main командою git merge"
        en: "Merge feature branch into main with git merge command"
      - uk: "При злитті можуть виникнути конфлікти"
        en: "Conflicts may arise during merge"
    see_also: ["конфлікт", "гілка", "pull_request"]
    tags: ["інтеграція", "гілки"]
    references:
      - title: "Git Documentation - Merge"
        url: "https://git-scm.com/docs/git-merge"
        type: "documentation"

  - uk: "клон"
    en: "clone"
    aliases_uk:
      - "клонування"
      - "копіювання"
    definition_uk: "Створення локальної копії віддаленого репозиторію"
    definition_en: "Creating a local copy of remote repository"
    examples:
      - uk: "Клонуйте репозиторій: git clone https://github.com/user/repo.git"
        en: "Clone repository: git clone https://github.com/user/repo.git"
    see_also: ["репозиторій", "віддалений_репозиторій"]
    tags: ["основи", "копіювання"]
    references:
      - title: "Git Documentation - Clone"
        url: "https://git-scm.com/docs/git-clone"
        type: "documentation"

  - uk: "пуш"
    en: "push"
    aliases_uk:
      - "відправка"
      - "завантаження"
    definition_uk: "Відправка локальних комітів на віддалений репозиторій"
    definition_en: "Sending local commits to remote repository"
    examples:
      - uk: "Відправте зміни командою git push origin main"
        en: "Push changes with git push origin main command"
    see_also: ["пул", "віддалений_репозиторій", "коміт"]
    tags: ["синхронізація", "віддалений"]
    references:
      - title: "Git Documentation - Push"
        url: "https://git-scm.com/docs/git-push"
        type: "documentation"

  - uk: "пул"
    en: "pull"
    aliases_uk:
      - "отримання"
      - "завантаження"
    definition_uk: "Отримання та інтеграція змін з віддаленого репозиторію в локальний"
    definition_en: "Fetching and integrating changes from remote repository into local"
    examples:
      - uk: "Оновіть локальну копію командою git pull"
        en: "Update local copy with git pull command"
    see_also: ["пуш", "fetch", "віддалений_репозиторій"]
    tags: ["синхронізація", "оновлення"]
    references:
      - title: "Git Documentation - Pull"
        url: "https://git-scm.com/docs/git-pull"
        type: "documentation"

  - uk: "конфлікт"
    en: "conflict"
    aliases_uk:
      - "конфлікт_злиття"
      - "суперечність"
    definition_uk: "Ситуація, коли Git не може автоматично об'єднати зміни через суперечливі правки"
    definition_en: "Situation when Git cannot automatically merge changes due to conflicting edits"
    examples:
      - uk: "Розв'яжіть конфлікти вручну та зробіть коміт"
        en: "Resolve conflicts manually and commit"
      - uk: "Конфлікти позначаються спеціальними маркерами в файлах"
        en: "Conflicts are marked with special markers in files"
    see_also: ["злиття", "розв'язання_конфліктів"]
    tags: ["проблеми", "злиття"]
    references:
      - title: "Git Documentation - Merge Conflicts"
        url: "https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging"
        type: "documentation"

  - uk: "стейдж"
    en: "stage"
    aliases_uk:
      - "індекс"
      - "область_підготовки"
    aliases_en:
      - "staging area"
      - "index"
    definition_uk: "Проміжна область, де підготовляються зміни перед комітом"
    definition_en: "Intermediate area where changes are prepared before commit"
    examples:
      - uk: "Додайте файли до стейджу командою git add"
        en: "Add files to stage with git add command"
      - uk: "Перегляньте стейдж командою git status"
        en: "View stage with git status command"
    see_also: ["коміт", "робоча_директорія"]
    tags: ["робочий_процес", "підготовка"]
    references:
      - title: "Git Documentation - Staging Area"
        url: "https://git-scm.com/book/en/v2/Getting-Started-Git-Basics"
        type: "documentation"

  - uk: "хеш"
    en: "hash"
    aliases_uk:
      - "sha"
      - "ідентифікатор_коміту"
    aliases_en:
      - "sha"
      - "commit id"
    definition_uk: "Унікальний ідентифікатор коміту, згенерований алгоритмом SHA-1"
    definition_en: "Unique commit identifier generated by SHA-1 algorithm"
    examples:
      - uk: "Хеш коміту виглядає як: a1b2c3d4e5f6..."
        en: "Commit hash looks like: a1b2c3d4e5f6..."
      - uk: "Використовуйте короткий хеш для посилання на коміт"
        en: "Use short hash to reference commit"
    see_also: ["коміт", "ідентифікатор"]
    tags: ["ідентифікація", "коміт"]

  - uk: "віддалений_репозиторій"
    en: "remote_repository"
    aliases_uk:
      - "ремоут"
      - "віддалений"
    aliases_en:
      - "remote"
    definition_uk: "Версія репозиторію, що зберігається на сервері або іншому комп'ютері"
    definition_en: "Version of repository stored on server or another computer"
    examples:
      - uk: "Додайте віддалений репозиторій: git remote add origin URL"
        en: "Add remote repository: git remote add origin URL"
      - uk: "Origin - стандартна назва основного віддаленого репозиторію"
        en: "Origin is standard name for main remote repository"
    see_also: ["origin", "пуш", "пул"]
    tags: ["мережа", "синхронізація"]

  - uk: "форк"
    en: "fork"
    aliases_uk:
      - "відгалуження_репозиторію"
      - "копія_репозиторію"
    definition_uk: "Копія репозиторію під вашим обліковим записом для незалежної розробки"
    definition_en: "Copy of repository under your account for independent development"
    examples:
      - uk: "Створіть форк репозиторію на GitHub"
        en: "Create fork of repository on GitHub"
      - uk: "Форк дозволяє вносити зміни без доступу до оригіналу"
        en: "Fork allows making changes without access to original"
    see_also: ["pull_request", "upstream"]
    tags: ["співпраця", "github"]

  - uk: "пул_реквест"
    en: "pull_request"
    aliases_uk:
      - "пр"
      - "запит_на_злиття"
    aliases_en:
      - "pr"
      - "merge_request"
    definition_uk: "Запит на перегляд та інтеграцію ваших змін в основний репозиторій"
    definition_en: "Request to review and integrate your changes into main repository"
    examples:
      - uk: "Створіть пул реквест після пушу гілки"
        en: "Create pull request after pushing branch"
      - uk: "Пул реквест проходить код-рев'ю перед злиттям"
        en: "Pull request goes through code review before merge"
    see_also: ["код_рев'ю", "злиття", "форк"]
    difficulty: "intermediate"
    tags: ["співпраця", "код_рев'ю"]
